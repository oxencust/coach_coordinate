<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>衡點健康 課程討論</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --white: #ffffff;
            --gray: #808080;
            --green: #A78BCA;
            --green-light: #F3E8FF;
            --green-dark: #7B5EA7;
            --pink: #f2ac98;
            --pink-light: #faece8;
            --pink-dark: #c67566;
            --yellow: #ffe08b;
            --yellow-light: #fcf4e3;
            --yellow-dark: #ba9e60;
            --blue: #9fcccc;
            --blue-light: #daedec;
            --blue-dark: #66888e;
            --bg: #f8f9f8;
            --card: #ffffff;
            --text: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #e5e5e5;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--pink-dark) 0%, var(--pink) 100%);
            padding: 18px 20px;
            color: var(--white);
            flex-shrink: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(194, 117, 102, 0.3);
            user-select: none;
            -webkit-user-select: none;
        }

        .header-content {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .back-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.3);
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 600;
        }

        .header-title span {
            font-size: 12px;
            opacity: 0.9;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .user-avatar-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--white);
            color: var(--pink-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        /* Container */
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* Compact Info Bar */
        .info-bar {
            margin: 0;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .info-bar:active {
            background: var(--bg);
        }

        .info-bar-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .info-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .course-icon-small {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--green-dark), var(--green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .info-bar-text {
            display: flex;
            flex-direction: column;
        }

        .info-bar-title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-bar-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .info-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .substitute-badge {
            background: var(--pink-light);
            color: var(--pink-dark);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .expand-icon {
            color: var(--text-muted);
            font-size: 12px;
            transition: transform 0.3s;
        }

        .info-bar.expanded .expand-icon {
            transform: rotate(180deg);
        }

        /* Expandable Detail */
        .info-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: var(--bg);
        }

        .info-bar.expanded .info-detail {
            max-height: 200px;
        }

        .info-detail-inner {
            padding: 12px 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .info-item {
            background: var(--card);
            padding: 10px 12px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 500;
        }

        .info-item.highlight {
            background: var(--pink-light);
        }

        .info-item.highlight .info-value {
            color: var(--pink-dark);
        }

        /* Participants - more compact */
        .participants-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--green-light);
            font-size: 12px;
            color: var(--green-dark);
            flex-shrink: 0;
        }

        .participants-avatars {
            display: flex;
        }

        .p-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--green);
            color: var(--white);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: -6px;
            border: 2px solid var(--green-light);
        }

        .p-avatar:first-child { margin-left: 0; }
        .p-avatar.student { background: var(--pink); }
        .p-avatar.me { 
            background: var(--pink); 
            box-shadow: 0 0 0 2px var(--pink-light);
        }

        /* Student Reminder */
        .student-reminder {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-bottom: 1px solid #a5d6a7;
            font-size: 12px;
            color: #2e7d32;
            flex-shrink: 0;
        }

        .student-reminder .reminder-icon {
            font-size: 14px;
        }

        .student-reminder .reminder-text {
            flex: 1;
            line-height: 1.4;
        }

        /* Messages */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            overscroll-behavior-x: none;
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            touch-action: pan-y;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg);
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
        }

        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }

        .message-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .msg-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--green);
            color: var(--white);
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .msg-sender {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .msg-sender .role {
            font-size: 10px;
            background: var(--green-light);
            color: var(--green-dark);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
        }

        .msg-sender .role.original {
            background: var(--blue-light);
            color: var(--blue-dark);
        }

        .msg-sender .role.substitute {
            background: var(--green-light);
            color: var(--green-dark);
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, var(--pink-dark), var(--pink));
            color: var(--white);
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: var(--card);
            color: var(--text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message.sent .message-time { text-align: right; }

        /* System Message */
        .system-message {
            align-self: center;
            background: var(--card);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin: 8px 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .system-message.success {
            background: var(--green-light);
            color: var(--green-dark);
        }

        .system-message.joined {
            background: var(--pink-light);
            color: var(--pink-dark);
        }

        /* Input Area */
        .input-area {
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .chat-input {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 12px 18px;
            padding-left: 48px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .chat-input:focus {
            border-color: var(--pink);
        }

        .notify-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--yellow);
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .notify-btn:active { 
            transform: scale(0.95); 
            background: var(--yellow-dark); 
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-dark), var(--pink));
            border: none;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(194, 117, 102, 0.3);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Quick Replies for Student */
        .quick-replies {
            position: relative;
        }

        .emoji-trigger {
            position: absolute;
            bottom: 100%;
            left: 16px;
            width: 40px;
            height: 40px;
            border: none;
            background: var(--white);
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .emoji-trigger.show {
            display: flex;
        }

        .emoji-panel {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            z-index: 100;
        }

        .emoji-panel.show {
            max-height: 60vh;
        }

        .emoji-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .emoji-panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .emoji-panel-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg);
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .emoji-panel-close:active {
            transform: scale(0.95);
            background: var(--border);
        }

        .emoji-panel-body {
            padding: 12px 16px;
            max-height: calc(60vh - 60px);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
        }

        .emoji-category {
            font-size: 12px;
            color: var(--text-muted);
            margin: 12px 0 8px 0;
            font-weight: 500;
        }

        .emoji-category:first-child {
            margin-top: 0;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .emoji-btn {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .emoji-btn:active {
            background: var(--pink-light);
            transform: scale(1.15);
        }

        /* 輸入區的表情按鈕 */
        .emoji-input-btn {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            z-index: 5;
        }

        .emoji-input-btn:active {
            background: var(--pink-light);
        }

        /* Typing Indicator */
        .typing-indicator {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--card);
            border-radius: 18px;
            font-size: 13px;
            color: var(--text-secondary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .typing-indicator.show { opacity: 1; }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Ended State */
        .chat-ended {
            padding: 16px;
            background: var(--green-light);
            text-align: center;
            flex-shrink: 0;
        }

        .chat-ended-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .chat-ended-text {
            font-size: 14px;
            color: var(--green-dark);
            font-weight: 500;
        }

        .chat-ended-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--pink-dark);
            color: var(--white);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 手機端優化 */
        @media (max-width: 768px) {
            .emoji-grid {
                grid-template-columns: repeat(6, 1fr);
            }

            /* 強化觸控體驗 */
            .back-btn,
            .send-btn,
            .notify-btn,
            .emoji-btn,
            .emoji-input-btn,
            .emoji-panel-close {
                touch-action: manipulation;
            }
            
            /* 防止長按選取 */
            .message-bubble,
            .header {
                -webkit-touch-callout: none;
                user-select: none;
                -webkit-user-select: none;
            }
        }

        /* iOS 專用優化 */
        @supports (-webkit-touch-callout: none) {
            .messages-area,
            .emoji-panel-body {
                -webkit-overflow-scrolling: touch;
            }
            
            /* 防止 iOS 橡皮筋效果 */
            html, body {
                position: fixed;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()">←</button>
                <div class="header-title">
                    <h1><img src="https://ik.imagekit.io/hanhealth/assets/logo.png?updatedAt=1772155101138" style="height: 22px; vertical-align: middle; margin-right: 6px;">衡點</h1>
                    <span>課程討論</span>
                </div>
            </div>
            <div class="user-badge">
                <div class="user-avatar-small" id="studentAvatar">-</div>
                <span id="studentName">載入中...</span>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Compact Info Bar (點擊展開詳情) -->
        <div class="info-bar" id="infoBar" onclick="toggleInfoBar()">
            <div class="info-bar-main">
                <div class="info-bar-left">
                    <div class="course-icon-small" id="courseIcon">📋</div>
                    <div class="info-bar-text">
                        <div class="info-bar-title" id="infoBarTitle">
                            載入中...
                        </div>
                        <div class="info-bar-subtitle" id="infoBarSubtitle">-</div>
                    </div>
                </div>
                <div class="info-bar-right">
                    <span class="substitute-badge" id="substituteBadge">-</span>
                    <span class="expand-icon">▼</span>
                </div>
            </div>
            <div class="info-detail">
                <div class="info-detail-inner">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">上課日期</div>
                            <div class="info-value" id="infoDate">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">上課時間</div>
                            <div class="info-value" id="infoTime">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">原教練</div>
                            <div class="info-value" id="infoOriginal">-</div>
                        </div>
                        <div class="info-item highlight">
                            <div class="info-label">代課教練</div>
                            <div class="info-value" id="infoSubstitute">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Participants - compact -->
        <div class="participants-bar">
            <span id="participantsText">👥 載入中...</span>
            <div class="participants-avatars" id="participantsAvatars">
            </div>
        </div>

        <!-- Messages - 更大的區域 -->
        <div class="messages-area" id="messagesArea">
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
        </div>

        <!-- 表情選擇面板 -->
        <div class="quick-replies">
            <div class="emoji-panel" id="emojiPanel">
                <div class="emoji-panel-header">
                    <span class="emoji-panel-title">選擇表情</span>
                    <button class="emoji-panel-close" onclick="closeEmojiPanel()">✕</button>

        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('request_id', requestId)
                .order('created_at', { ascending: true });

                return;
            }
            
            console.log('Loaded messages:', data);
            
            // 找到學員加入的訊息時間點
            const joinedMessage = data.find(msg => 
                msg.message_type === 'system' && msg.system_subtype === 'student_joined'
            );
            
            // 只顯示學員加入後的訊息
            let filteredMessages = data;
            if (joinedMessage) {
                const joinedTime = new Date(joinedMessage.created_at);
                filteredMessages = data.filter(msg => new Date(msg.created_at) >= joinedTime);
            }
            
            renderAllMessages(filteredMessages);
        }

        function renderAllMessages(messages) {
            const container = document.getElementById('messagesArea');
            const typing = document.getElementById('typingIndicator');
            
            // 清除舊訊息（保留 typing indicator）
            container.innerHTML = '';
            container.appendChild(typing);
            
            // 加入歡迎訊息
            const welcomeMsg = document.createElement('div');
            welcomeMsg.className = 'system-message joined';
            welcomeMsg.textContent = '🎉 您已加入討論，可以開始與教練溝通了！';
            container.insertBefore(welcomeMsg, typing);
            
            messages.forEach(msg => {
                const msgEl = document.createElement('div');
                
                if (msg.message_type === 'system') {
                    msgEl.className = `system-message ${msg.system_subtype === 'student_joined' ? 'joined' : ''}`;
                    msgEl.textContent = msg.content;
                } else {
                    const isSent = msg.sender_student_id === currentStudent.id;
                    const time = new Date(msg.created_at);
                    const timeStr = `${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}`;
                    
                    msgEl.className = `message ${isSent ? 'sent' : 'received'}`;
                    
                    if (isSent) {
                        msgEl.innerHTML = `
                            <div class="message-bubble">${msg.content}</div>
                            <div class="message-time">${timeStr}</div>
                        `;
                    } else {
                        const senderName = msg.sender_name || '教練';
                        const senderAvatar = senderName.charAt(0) || '?';
                        const role = msg.sender_coach_id === currentRequest.original_coach_id ? 'original' : 'substitute';
                        const roleText = role === 'original' ? '原教練' : '代課';
                        msgEl.innerHTML = `
                            <div class="message-header">
                                <span class="msg-avatar">${senderAvatar}</span>
                                <span class="msg-sender">${senderName} <span class="role ${role}">${roleText}</span></span>
                            </div>
                            <div class="message-bubble">${msg.content}</div>
                            <div class="message-time">${timeStr}</div>
                        `;
                    }
                }
                
                container.insertBefore(msgEl, typing);
            });
            
            container.scrollTop = container.scrollHeight;
        }

        function subscribeToMessages() {

                        table: 'messages',

                    if (currentStudent && data.user_id === currentStudent.id) return;
                    
                    const indicator = document.getElementById('typingIndicator');
                    
                    if (data.is_typing) {
                        indicator.classList.add('show');
                        
                        // 滾動到底部
                        const container = document.getElementById('messagesArea');
                        container.scrollTop = container.scrollHeight;
                    } else {
                        indicator.classList.remove('show');
                    }
                })
                .subscribe();
        }
        
        function handleTyping() {
            if (!currentStudent || !typingChannel) return;
            
            // 如果還沒發送 typing 狀態，發送一次
            if (!isTyping) {
                isTyping = true;
                typingChannel.send({
                    type: 'broadcast',
                    event: 'typing',
                    payload: {
                        user_id: currentStudent.id,
                        user_name: currentStudent.name,
                        is_typing: true
                    }
                });
            }
            
            // 清除之前的 timeout
            if (typingTimeout) {
                clearTimeout(typingTimeout);
            }
            
            // 2 秒後停止 typing 狀態
            typingTimeout = setTimeout(() => {
                stopTyping();
            }, 2000);
        }
        
        function stopTyping() {
            if (!currentStudent || !typingChannel || !isTyping) return;
            
            isTyping = false;
            typingChannel.send({
                type: 'broadcast',
                event: 'typing',
                payload: {
                    user_id: currentStudent.id,
                    user_name: currentStudent.name,
                    is_typing: false
                }
            });
        }

        // ============ UI Functions ============
        function toggleInfoBar() {
            document.getElementById('infoBar').classList.toggle('expanded');
        }

        function goBack() {
            if (window.liff && liff.isInClient()) {
                liff.closeWindow();
            } else {
                window.history.back();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content || !currentStudent) return;
            input.value = '';
            
            // 停止 typing 狀態
            stopTyping();

            try {
                await supabaseClient
                    .from('messages')
                    .insert({
                        request_id: requestId,
                        sender_student_id: currentStudent.id,
                        sender_name: currentStudent.name,
                        message_type: 'text',
                        content: content
                    });
                
                // 只推播一次：教練不在線 且 尚未推播過
                if (!hasNotifiedCoaches) {
                    const coachesOnline = await checkCoachesOnline();
                    if (!coachesOnline) {
                        notifyNewMessage(content);
                        hasNotifiedCoaches = true; // 標記已推播
                    }
                }
                
                // Realtime 會自動更新
            } catch (error) {
                console.error('Send error:', error);
                showToast('發送失敗');
            }
        }
        
        // 通知教練（不等待結果）
        function notifyNewMessage(content, forceNotify = false) {
            fetch(`${SUPABASE_URL}/functions/v1/notify-coaches`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({
                    request_id: requestId,
                    sender_id: currentStudent.id,
                    sender_name: currentStudent.name,
                    message_content: content,
                    force_notify: forceNotify
                })
            }).catch(err => console.log('Notify error:', err));
        }
        
        // 檢查教練是否在聊天室（60秒內有活動視為在線）
        async function checkCoachesOnline() {
            if (!requestId) return true; // 預設當作在線，不推播
            
            try {
                const threshold = new Date(Date.now() - 60000).toISOString(); // 60秒前
                
                const { data, error } = await supabaseClient
                    .from('user_presence')
                    .select('user_id')
                    .eq('request_id', requestId)
                    .eq('user_type', 'coach')
                    .gte('last_active_at', threshold);
                
                if (error) {
                    console.log('Check presence error:', error);
                    return true; // 出錯時預設在線，不推播
                }
                
                // 如果有教練在線，返回 true
                return data && data.length > 0;
            } catch (err) {
                console.log('Check presence error:', err);
                return true;
            }
        }

        // 強制通知對方（含 30 秒冷卻）
async function forceNotify() {
    if (!requestId || !currentStudent) return;
    
    // 檢查冷卻中
    if (notifyCooldown) {
        showToast('請稍候再試');
        return;
    }
    
    // 確認彈窗
    if (!confirm('📢是否通知教練查看聊天室呢?')) {
        return;
    }
    
    // 開始冷卻
    startNotifyCooldown();
    
    showToast('正在通知教練...');
    
    try {
        // 取得課程資訊
        const courseTypeNames = {
            'pilates': '皮拉提斯',
            'weight': '重量訓練',
            'stretch': '伸展課程',
            'ai': 'AI 體態分析'
        };
        const courseTypeName = courseTypeNames[currentRequest.course_type] || currentRequest.course_type;
        const courseDate = formatDate(currentRequest.course_date);
        const courseTime = currentRequest.course_time;
        
        const response = await fetch(`${SUPABASE_URL}/functions/v1/notify-coaches`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
                request_id: requestId,
                sender_id: currentStudent.id,
                sender_name: currentStudent.name,
                sender_type: 'student',
                course_type: courseTypeName,
                course_date: courseDate,
                course_time: courseTime,
                force_notify: true
            })
        });
        
        const result = await response.json();
        if (result.notified > 0) {
            showToast(`已通知 ${result.notified} 位教練 ✓`);
        } else {
            showToast('沒有需要通知的人');
        }
    } catch (err) {
        console.error('Force notify error:', err);
        showToast('通知失敗');
    }
}

// 通知冷卻倒數
function startNotifyCooldown() {
    notifyCooldown = true;
    let countdown = 30;
    
    const notifyBtn = document.querySelector('.notify-btn');
    notifyBtn.disabled = true;
    notifyBtn.style.opacity = '0.6';
    notifyBtn.style.cursor = 'not-allowed';
    notifyBtn.innerHTML = `<span style="font-size:12px;">${countdown}</span>`;
    
    cooldownTimer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
            notifyBtn.innerHTML = `<span style="font-size:12px;">${countdown}</span>`;
        } else {
            // 冷卻結束
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            notifyCooldown = false;
            notifyBtn.disabled = false;
            notifyBtn.style.opacity = '1';
            notifyBtn.style.cursor = 'pointer';
            notifyBtn.innerHTML = '📢';
        }
    }, 1000);
}

        // ============ 在線狀態追蹤 ============
        let presenceInterval = null;

        async function updatePresence() {
            if (!requestId || !currentStudent?.id) return;
            
            try {
                await supabaseClient
                    .from('user_presence')
                    .upsert({
                        user_type: 'student',
                        user_id: currentStudent.id,
                        request_id: requestId,
                        last_active_at: new Date().toISOString()
                    }, {
                        onConflict: 'user_type,user_id,request_id'
                    });
            } catch (err) {
                console.log('Presence update error:', err);
            }
        }

// ============ Realtime Presence (即時在線狀態) ============
async function joinPresenceChannel() {
    if (!requestId || !currentStudent) return;
    
    // 清除舊的
    if (presenceChannel) {
        await presenceChannel.untrack();
        presenceChannel.unsubscribe();
    }
    
    presenceChannel = supabaseClient
        .channel(`room-presence-${requestId}`)
        .on('presence', { event: 'sync' }, () => {
            // 學員端不需要顯示其他人狀態，但需要註冊這個事件讓 Presence 正常運作
            console.log('Presence sync:', presenceChannel.presenceState());
        })
        .on('presence', { event: 'join' }, ({ key, newPresences }) => {
            console.log('User joined:', newPresences);
        })
        .on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
            console.log('User left:', leftPresences);
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                console.log('Student joined presence channel');
                await presenceChannel.track({
                    user_type: 'student',
                    user_id: currentStudent.id,
                    user_name: currentStudent.name,
                    online_at: new Date().toISOString()
                });
            }
        });
}

function leavePresenceChannel() {
    if (presenceChannel) {
        presenceChannel.untrack();
        presenceChannel.unsubscribe();
        presenceChannel = null;
    }
}
        
        function startPresenceTracking() {
            updatePresence();
            presenceInterval = setInterval(updatePresence, 30000); // 每 30 秒更新
        }

        function stopPresenceTracking() {
    if (presenceInterval) {
        clearInterval(presenceInterval);
        presenceInterval = null;
    }
    // 離開即時 Presence 頻道
    leavePresenceChannel();
    // 取消教練在線訂閱
    if (presenceSubscription) {
        presenceSubscription.unsubscribe();
        presenceSubscription = null;
    }
}

        function sendQuick(content) {
            document.getElementById('chatInput').value = content;
            sendMessage();
        }

        // ============ Emoji Panel Functions ============
        let emojiPanelOpen = false;
        let recentEmojis = ['👍', '🙏', '😊', '👋', '💪', '❤️'];
        
        // 從 localStorage 載入最近使用的表情
        function loadRecentEmojis() {
            const saved = localStorage.getItem('recentEmojis');
            if (saved) {
                recentEmojis = JSON.parse(saved);
                renderRecentEmojis();
            }
        }
        
        // 儲存最近使用的表情
        function saveRecentEmojis() {
            localStorage.setItem('recentEmojis', JSON.stringify(recentEmojis));
        }
        
        // 渲染最近使用的表情
        function renderRecentEmojis() {
            const container = document.getElementById('recentEmojis');
            if (container) {
                container.innerHTML = recentEmojis.map(emoji => 
                    `<button class="emoji-btn" onclick="sendEmoji('${emoji}')">${emoji}</button>`
                ).join('');
            }
        }
        
        // 展開/收合表情面板
        function toggleEmojiPanel() {
            emojiPanelOpen = !emojiPanelOpen;
            document.getElementById('emojiPanel').classList.toggle('show', emojiPanelOpen);
        }
        
        // 關閉表情面板
        function closeEmojiPanel() {
            emojiPanelOpen = false;
            document.getElementById('emojiPanel').classList.remove('show');
        }
        
        // 發送表情
        function sendEmoji(emoji) {
            sendQuick(emoji);
            closeEmojiPanel();
            
            // 更新最近使用
            const index = recentEmojis.indexOf(emoji);
            if (index > -1) {
                recentEmojis.splice(index, 1);
            }
            recentEmojis.unshift(emoji);
            if (recentEmojis.length > 6) {
                recentEmojis.pop();
            }
            saveRecentEmojis();
            renderRecentEmojis();
        }

        function showTyping() {
            document.getElementById('typingIndicator').classList.add('show');
            const container = document.getElementById('messagesArea');
            container.scrollTop = container.scrollHeight;
        }

        function hideTyping() {
            document.getElementById('typingIndicator').classList.remove('show');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ============ Helpers ============
        function getCourseTypeName(type) {
            const names = {
                'pilates': '皮拉提斯',
                'weight': '重量訓練',
                'stretch': '伸展課程',
                'ai': 'AI 體態分析'
            };
            return names[type] || type;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[date.getDay()];
            return `${month}/${day}（${weekday}）`;
        }

        // ============ Enter 鍵送出訊息 ============
        document.addEventListener('DOMContentLoaded', function() {
            const chatInput = document.getElementById('chatInput');
            if (chatInput) {
                chatInput.addEventListener('keydown', function(e) {
                    // Enter 送出（不含 Shift）
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault(); // 防止換行
                        sendMessage();
                    }
                    // Shift + Enter 換行（預設行為，不用處理）
                });
            }
        });

        // ============ Start ============
        document.addEventListener('DOMContentLoaded', init);
    </script>
